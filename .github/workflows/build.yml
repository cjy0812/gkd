name: build

on:
  workflow_dispatch:

  push:
    branches:
      - '**'
    paths-ignore:
      - 'LICENSE'
      - '*.md'
      - '.github/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: check release keystore availability
        id: signing
        shell: bash
        env:
          GKD_STORE_FILE_BASE64: ${{ secrets.GKD_STORE_FILE_BASE64 }}
        run: |
          if [[ -n "$GKD_STORE_FILE_BASE64" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: write gkd keystore
        if: steps.signing.outputs.available == 'true'
        run: echo ${{ secrets.GKD_STORE_FILE_BASE64 }} | base64 --decode > ${{ github.workspace }}/gkd.jks

      - name: build signed release
        if: steps.signing.outputs.available == 'true'
        run: ./gradlew :gkd-android:assembleGkdRelease
        env:
          GKD_GITHUB_COOKIE: ${{ secrets.GKD_GITHUB_COOKIE }}
          GKD_SERVER_TOKEN: ${{ secrets.GKD_SERVER_TOKEN }}
          GKD_STORE_FILE: ${{ github.workspace }}/gkd.jks
          GKD_STORE_PASSWORD: ${{ secrets.GKD_STORE_PASSWORD }}
          GKD_KEY_ALIAS: ${{ secrets.GKD_KEY_ALIAS }}
          GKD_KEY_PASSWORD: ${{ secrets.GKD_KEY_PASSWORD }}
          GKD_RENAME_PACKAGE_FLAG: "1"

      - uses: actions/upload-artifact@v7
        if: steps.signing.outputs.available == 'true'
        with:
          archive: false
          path: gkd-android/build/outputs/apk/gkd/release/*.apk

      - name: derive outputs artifact name from APK
        if: steps.signing.outputs.available == 'true'
        id: outputs-artifact
        shell: bash
        run: |
          apk_files=(gkd-android/build/outputs/apk/gkd/release/gkd-v*.apk)
          [[ ${#apk_files[@]} -eq 1 && -f "${apk_files[0]}" ]]
          apk_name=$(basename "${apk_files[0]}" .apk)
          echo "name=${apk_name}.outputs" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: steps.signing.outputs.available == 'true'
        with:
          name: ${{ steps.outputs-artifact.outputs.name }}
          path: gkd-android/build/outputs

  build-android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      # Forks may not have the private release keystore secrets. The standard
      # Android debug key is sufficient for installing a test build.
      - run: ./gradlew :gkd-android:assembleGkdDebug
        env:
          GKD_GITHUB_COOKIE: ${{ secrets.GKD_GITHUB_COOKIE }}
          GKD_SERVER_TOKEN: ${{ secrets.GKD_SERVER_TOKEN }}

      - uses: actions/upload-artifact@v7
        with:
          name: gkd-network-compatibility-debug
          archive: false
          path: gkd-android/build/outputs/apk/gkd/debug/*.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: run matching regression and build Windows portable package
        run: ./gradlew.bat :gkd-app:matchingRegression :gkd-app:packageWindowsPortable
        env:
          GKD_RENAME_PACKAGE_FLAG: "1"

      - name: upload matching regression report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matching-regression
          path: |
            gkd-app/build/reports/tests/matchingRegression
            gkd-app/build/test-results/matchingRegression
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        with:
          archive: false
          include-hidden-files: true
          if-no-files-found: error
          path: .local/desktop-packages/gkd-v*.win-*.zip
